{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Create Account</h1>
    <p class="muted">Register to start discovering movies.</p>
    <form method="POST">
        <label>Full name</label><input type="text" name="full_name" required>
        <label>Username</label><input type="text" name="username" minlength="3" required>
        <label>Email address</label><input type="email" name="email" required>
        <label>Password</label><input type="password" name="password" minlength="8" required>
        <label>Confirm password</label><input type="password" name="confirm_password" minlength="8" required>
        <button type="submit">Register</button>
    </form>
    <p class="bottom-text">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
</div>
{% endblock %}
