{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Login</h1>
    <p class="muted">Sign in to your MovieMate account.</p>
    <form method="POST">
        <label>Username or email</label><input type="text" name="username_or_email" required>
        <label>Password</label><input type="password" name="password" required>
        <button type="submit">Login</button>
    </form>
    <p class="bottom-text">New user? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
